<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Plant cell diagram</title>
  <desc id="desc">A simplified plant cell with a cell wall, cell membrane, nucleus, chloroplasts, and vacuole.</desc>
  <rect width="720" height="420" rx="28" fill="#f0fdf4"/>
  <rect x="85" y="45" width="550" height="330" rx="70" fill="#bbf7d0" stroke="#166534" stroke-width="10"/>
  <rect x="105" y="65" width="510" height="290" rx="58" fill="#dcfce7" stroke="#22c55e" stroke-width="6"/>
  <ellipse cx="382" cy="205" rx="145" ry="100" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="6"/>
  <circle cx="382" cy="205" r="42" fill="#60a5fa" stroke="#1e40af" stroke-width="5"/>
  <ellipse cx="185" cy="130" rx="42" ry="22" fill="#86efac" stroke="#15803d" stroke-width="5"/>
  <ellipse cx="188" cy="290" rx="42" ry="22" fill="#86efac" stroke="#15803d" stroke-width="5"/>
  <ellipse cx="555" cy="130" rx="42" ry="22" fill="#86efac" stroke="#15803d" stroke-width="5"/>
  <ellipse cx="550" cy="292" rx="42" ry="22" fill="#86efac" stroke="#15803d" stroke-width="5"/>
  <text x="355" y="213" font-family="Arial" font-size="20" font-weight="700" fill="#1e3a8a">N</text>
  <text x="133" y="40" font-family="Arial" font-size="22" font-weight="700" fill="#166534">Cell wall</text>
  <text x="525" y="397" font-family="Arial" font-size="22" font-weight="700" fill="#15803d">Chloroplasts</text>
  <text x="336" y="335" font-family="Arial" font-size="22" font-weight="700" fill="#1d4ed8">Vacuole</text>
</svg>
